apiVersion: v1
kind: Namespace
metadata:
  name: qwen3-asr-transcription
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: qwen3-asr-gpu
  namespace: qwen3-asr-transcription
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr-worker
  namespace: qwen3-asr-transcription
  labels:
    app.kubernetes.io/name: qwen3-asr
    app.kubernetes.io/part-of: animal-crossing-speech-research
spec:
  # Kept as an optional full-GPU worker. The HAMI worker below is the active
  # deployment for this transcription run and avoids a 14.4 GB cold image pull.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-asr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-asr
        app.kubernetes.io/part-of: animal-crossing-speech-research
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: <gpu-node>
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: qwen3-asr-gpu
      containers:
        - name: qwen3-asr
          image: qwenllm/qwen3-asr:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["exec sleep infinity"]
          resources:
            claims:
              - name: gpu
                request: gpu
            requests:
              cpu: "2"
              memory: 12Gi
              ephemeral-storage: 16Gi
            limits:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 64Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: cache
              mountPath: /root/.cache
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 12Gi
        - name: cache
          emptyDir:
            sizeLimit: 16Gi
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: qwen3-asr-hami-gpu
  namespace: qwen3-asr-transcription
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: hami-core-gpu.project-hami.io
            allocationMode: ExactCount
            count: 1
            capacity:
              requests:
                cores: "70"
                memory: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-asr-hami-worker
  namespace: qwen3-asr-transcription
  labels:
    app.kubernetes.io/name: qwen3-asr-hami
    app.kubernetes.io/part-of: animal-crossing-speech-research
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: <gpu-node>
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: qwen3-asr-hami-gpu
  containers:
    - name: qwen3-asr
      image: ghcr.io/nekomeowww/oci-ml-nvidia-cuda:py3.13-13.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args: ["exec sleep infinity"]
      resources:
        claims:
          - name: gpu
            request: gpu
        requests:
          cpu: "2"
          memory: 12Gi
          ephemeral-storage: 16Gi
        limits:
          cpu: "8"
          memory: 64Gi
          ephemeral-storage: 64Gi
      volumeMounts:
        - name: work
          mountPath: /work
        - name: cache
          mountPath: /root/.cache
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 12Gi
    - name: cache
      emptyDir:
        sizeLimit: 16Gi
